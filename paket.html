<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paket Outbound Malang Batu | GemilangKatunOutbond</title>
  <link rel="icon" type="image/png" href="src/assets/images/logo.webp" />
  
  <meta name="description" content="Daftar harga paket outbound GemilangKatunOutbond Malang & Batu: Sekolah, Perusahaan, Keluarga, Kampus, Rafting & Paintball. Hubungi +62-83115542771." />
  <meta name="keywords" content="gemilangkatunoutbond, paket outbound malang, harga outbound batu, paket team building malang, paket outbound sekolah" />
  <link rel="canonical" href="https://gemilangkatunoutbond.co.id/paket.html" />

  <link rel="stylesheet" href="/src/index.css" />
</head>
<body class="bg-[#F9F9F4] text-[#333333] antialiased selection:bg-[#3A5A40] selection:text-white font-sans">

  <!-- Mount Navbar -->
  <div id="navbar-mount"></div>

  <!-- HEADER BANNER -->
  <section class="py-16 bg-[#3A5A40] text-white text-center relative reveal">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-3">
      <span class="inline-block px-3.5 py-1 rounded-full bg-[#A3B18A]/30 border border-[#A3B18A]/50 text-white text-xs font-bold uppercase tracking-widest">
        Katalog GemilangKatunOutbond 2026
      </span>
      <h1 class="text-3xl sm:text-4xl font-serif font-bold text-white italic">Daftar Paket Outbound Malang Batu</h1>
      <p class="text-xs sm:text-sm text-[#DAD7CD] max-w-2xl mx-auto font-light leading-relaxed">
        Temukan paket outbound dan team building yang sesuai dengan kategori kelompok, tujuan acara, dan anggaran Anda.
      </p>
    </div>
  </section>

  <!-- FILTER KATEGORI & GRID PAKET -->
  <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 reveal">
    
    <!-- Filter Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-2 mb-10" id="filter-buttons">
      <button data-cat="all" class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all filter-btn bg-[#3A5A40] text-white shadow-sm">
        Semua Paket
      </button>
      <button data-cat="Perusahaan" class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all filter-btn bg-white text-[#5A5A40] hover:bg-[#F5F5F0] border border-[#E0E0D6]">
        Perusahaan
      </button>
      <button data-cat="Sekolah" class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all filter-btn bg-white text-[#5A5A40] hover:bg-[#F5F5F0] border border-[#E0E0D6]">
        Sekolah
      </button>
      <button data-cat="Keluarga" class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all filter-btn bg-white text-[#5A5A40] hover:bg-[#F5F5F0] border border-[#E0E0D6]">
        Keluarga
      </button>
      <button data-cat="Kampus/Organisasi" class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all filter-btn bg-white text-[#5A5A40] hover:bg-[#F5F5F0] border border-[#E0E0D6]">
        Kampus / Organisasi
      </button>
    </div>

    <!-- Grid Container -->
    <div id="packages-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Injected via JS -->
    </div>

  </section>

  <!-- Mount Footer -->
  <div id="footer-mount"></div>

  <script type="module">
    import { renderNavbar, renderFooter, renderFloatingWA, openBookingModal, initScrollReveal } from '/src/js/shared.js';
    import { packagesData } from '/src/data/packages.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('paket');
      renderFooter();
      renderFloatingWA();

      const grid = document.getElementById('packages-grid');
      const filterBtns = document.querySelectorAll('.filter-btn');

      function renderGrid(filteredList) {
        if (!grid) return;
        if (filteredList.length === 0) {
          grid.innerHTML = `<p class="col-span-full text-center text-[#5A5A40] py-12 text-sm">Tidak ada paket ditemukan untuk kategori ini.</p>`;
          return;
        }

        grid.innerHTML = filteredList.map(pkg => `
          <div class="rounded-2xl bg-white border border-[#E0E0D6] shadow-sm overflow-hidden flex flex-col justify-between group hover:shadow-md transition-all duration-300 reveal">
            <div>
              <div class="relative h-48 overflow-hidden">
                <img src="${pkg.image}" alt="${pkg.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                <span class="absolute top-3 right-3 px-3 py-1 rounded-full bg-[#3A5A40] text-white font-bold text-[10px] uppercase tracking-wider shadow-sm">
                  ${pkg.badge}
                </span>
                <span class="absolute bottom-3 left-3 px-2.5 py-1 rounded-md bg-white/90 text-[#3A5A40] text-xs font-semibold backdrop-blur-sm border border-[#E0E0D6] flex items-center space-x-1">
                  <svg class="w-3.5 h-3.5 text-[#3A5A40]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                  <span>${pkg.location}</span>
                </span>
              </div>

              <div class="p-5 space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="text-[10px] font-bold text-[#3A5A40] uppercase tracking-widest">${pkg.categoryLabel}</span>
                  <span class="text-[10px] text-[#5A5A40] font-medium flex items-center space-x-1">
                    <svg class="w-3 h-3 text-[#3A5A40]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>${pkg.duration}</span>
                  </span>
                </div>
                <h3 class="text-base font-bold text-[#3A5A40] leading-snug">${pkg.title}</h3>
                <p class="text-xs text-[#5A5A40] line-clamp-2 leading-relaxed">${pkg.shortDesc}</p>

                <div class="pt-3 border-t border-[#E0E0D6]">
                  <span class="text-[10px] text-[#5A5A40] block">Investasi Mulai</span>
                  <div class="text-xl font-bold text-[#3A5A40]">
                    ${pkg.price} <small class="text-xs font-normal text-[#5A5A40]">${pkg.priceUnit}</small>
                  </div>
                </div>
              </div>
            </div>

            <div class="p-5 pt-0 flex items-center space-x-2">
              <a href="paket-detail.html?id=${pkg.id}" class="flex-1 py-2.5 rounded-full bg-[#F5F5F0] hover:bg-[#E0E0D6] text-center text-xs font-bold text-[#3A5A40] transition-colors">
                Detail Lengkap
              </a>
              <button onclick="window.bookingTrigger('${pkg.id}')" class="flex-1 py-2.5 rounded-full bg-[#3A5A40] hover:bg-[#2C4530] text-white text-center text-xs font-bold uppercase tracking-wider shadow-sm">
                Booking
              </button>
            </div>
          </div>
        `).join('');

        initScrollReveal();
      }

      // Initial render
      renderGrid(packagesData);

      // Filter events
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('bg-[#3A5A40]', 'text-white', 'shadow-sm');
            b.classList.add('bg-white', 'text-[#5A5A40]', 'hover:bg-[#F5F5F0]', 'border', 'border-[#E0E0D6]');
          });

          btn.classList.remove('bg-white', 'text-[#5A5A40]', 'hover:bg-[#F5F5F0]', 'border', 'border-[#E0E0D6]');
          btn.classList.add('bg-[#3A5A40]', 'text-white', 'shadow-sm');

          const cat = btn.getAttribute('data-cat');
          if (cat === 'all') {
            renderGrid(packagesData);
          } else {
            const filtered = packagesData.filter(p => p.category === cat);
            renderGrid(filtered);
          }
        });
      });

      window.bookingTrigger = (pkgId) => {
        const foundPkg = packagesData.find(p => p.id === pkgId);
        openBookingModal(foundPkg || {});
      };

      initScrollReveal();
    });
  </script>
</body>
</html>
