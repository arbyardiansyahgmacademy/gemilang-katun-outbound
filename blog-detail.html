<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="blog-page-title">Artikel Outbound | GemilangKatunOutbond</title>
  <link rel="icon" type="image/png" href="/assets/images/logoo.webp" />
  
  <meta name="description" id="blog-page-desc" content="Artikel panduan dan informasi outbound Malang Batu dari GemilangKatunOutbond." />
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body class="bg-[#0B132B] text-[#E2E8F0] antialiased selection:bg-[#2563EB] selection:text-white font-sans">

  <!-- Mount Navbar -->
  <div id="navbar-mount"></div>

  <main class="py-12 max-w-4xl mx-auto px-4 sm:px-6">
    
    <!-- Breadcrumb -->
    <div class="mb-6 flex items-center space-x-2 text-xs text-[#94A3B8]">
      <a href="/" class="hover:text-[#38BDF8] hover:underline">Beranda</a>
      <span>/</span>
      <a href="/blog.html" class="hover:text-[#38BDF8] hover:underline">Blog & Artikel</a>
      <span>/</span>
      <span id="blog-breadcrumb-title" class="text-[#38BDF8] font-bold">Detail Artikel</span>
    </div>

    <!-- Main Blog Article Mount -->
    <div id="blog-article-mount" class="space-y-8">
      <!-- Injected via JS -->
    </div>

  </main>

  <!-- CTA BANNER -->
  <section class="py-16 bg-[#111D38] border-t border-[#1E2F4D] text-white text-center reveal">
    <div class="max-w-4xl mx-auto px-4 space-y-5">
      <h2 class="text-2xl sm:text-3xl font-serif italic text-white">Konsultasikan Kebutuhan Outbound Anda Sekarang!</h2>
      <p class="text-xs sm:text-sm text-[#94A3B8] max-w-xl mx-auto font-light leading-relaxed">
        Tim CS kami siap membantu merancang susunan acara (rundown) dan estimasi anggaran sesuai budget Anda.
      </p>
      <div>
        <a href="https://wa.me/6283115542771?text=Halo%20Admin%20GemilangKatunOutbond,%20saya%20ingin%20konsultasi%20paket%20outbound" target="_blank" class="inline-flex items-center space-x-2 px-8 py-3.5 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-bold uppercase text-xs tracking-wider shadow-lg transition-all border border-blue-400/20">
          <span>Konsultasi Bebas Biaya via WA</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </a>
      </div>
    </div>
  </section>

  <!-- Mount Footer -->
  <div id="footer-mount"></div>

  <script type="module">
    import { renderNavbar, renderFooter, renderFloatingWA, initScrollReveal } from '/src/js/shared.js';
    import { blogsData } from '/src/data/blogs.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('blog');
      renderFooter();
      renderFloatingWA();

      const urlParams = new URLSearchParams(window.location.search);
      let blogId = urlParams.get('id');
      if (!blogId) {
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (pathParts.length > 0) {
          const lastPart = pathParts[pathParts.length - 1].replace('.html', '');
          if (lastPart && lastPart !== 'blog' && lastPart !== 'blog-detail') {
            blogId = lastPart;
          }
        }
      }
      if (!blogId) blogId = blogsData[0].id;

      const blog = blogsData.find(b => b.id === blogId) || blogsData[0];

      // Update titles
      document.getElementById('blog-page-title').textContent = `${blog.title} | GemilangKatunOutbond`;
      document.getElementById('blog-page-desc').setAttribute('content', blog.excerpt);
      document.getElementById('blog-breadcrumb-title').textContent = blog.title;

      const mount = document.getElementById('blog-article-mount');
      if (mount) {
        mount.innerHTML = `
          <article class="space-y-6 reveal">
            <!-- Category & Header -->
            <div class="space-y-3">
              <span class="inline-block px-3 py-1 rounded-full bg-[#2563EB] text-white text-xs font-bold uppercase tracking-wider border border-[#1E2F4D]">
                ${blog.category}
              </span>
              <h1 class="text-2xl sm:text-4xl font-serif font-bold text-white leading-tight">${blog.title}</h1>
              
              <div class="text-xs text-[#94A3B8] flex items-center space-x-4 pt-1">
                <span class="flex items-center space-x-1">
                  <svg class="w-4 h-4 text-[#38BDF8]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  <span>${blog.date}</span>
                </span>
                <span>•</span>
                <span class="flex items-center space-x-1">
                  <svg class="w-4 h-4 text-[#38BDF8]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                  <span>Ditulis oleh: <strong class="text-white">${blog.author}</strong></span>
                </span>
              </div>
            </div>

            <!-- Featured Image -->
            <div class="rounded-3xl overflow-hidden border border-[#1E2F4D] shadow-md">
              <img src="${blog.image}" alt="${blog.title}" class="w-full h-[320px] sm:h-[420px] object-cover" />
            </div>

            <!-- Article Body -->
            <div class="p-6 sm:p-10 rounded-3xl bg-[#131F37] border border-[#1E2F4D] shadow-sm space-y-6 text-xs sm:text-sm text-[#94A3B8] leading-relaxed font-light [&_h2]:text-xl [&_h2]:font-serif [&_h2]:font-bold [&_h2]:text-white [&_h2]:mt-6 [&_h2]:mb-3 [&_p]:mb-4 [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:space-y-2 [&_strong]:text-white [&_strong]:font-semibold">
              ${blog.content}
            </div>

            <!-- Author Bio Box -->
            <div class="p-6 rounded-2xl bg-[#0B132B] border border-[#1E2F4D] flex items-center space-x-4">
              <div class="w-12 h-12 rounded-full bg-[#2563EB]/20 text-[#38BDF8] flex items-center justify-center font-bold text-lg border border-[#1E2F4D]">
                G
              </div>
              <div>
                <strong class="text-white text-sm block font-bold">Tim Redaksi GemilangKatunOutbond</strong>
                <p class="text-xs text-[#94A3B8] mt-0.5">Praktisi experiential learning & penyelenggara wisata outdoor terpercaya di Malang & Batu.</p>
              </div>
            </div>

          </article>
        `;

        initScrollReveal();
      }
    });
  </script>
</body>
</html>
